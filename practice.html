<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>תרגול אסוציאציות - OADictionary</title>
<meta name="description" content="תרגלו אסוציאציות למילים באנגלית במצב אקראי, חשפו את התשובה ודרגו כמה היא עזרה לכם לזכור." />
<link rel="canonical" href="https://yakmos.github.io/oadictionary/practice.html" />
<meta property="og:type" content="website" />
<meta property="og:title" content="תרגול אסוציאציות - OADictionary" />
<meta property="og:description" content="תרגלו אסוציאציות למילים באנגלית במצב אקראי, חשפו את התשובה ודרגו כמה היא עזרה לכם לזכור." />
<meta property="og:image" content="https://yakmos.github.io/oadictionary/img/og-image.jpg" />
<meta property="og:url" content="https://yakmos.github.io/oadictionary/practice.html" />
<meta property="og:locale" content="he_IL" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="תרגול אסוציאציות - OADictionary" />
<meta name="twitter:description" content="תרגלו אסוציאציות למילים באנגלית במצב אקראי, חשפו את התשובה ודרגו כמה היא עזרה לכם לזכור." />
<meta name="twitter:image" content="https://yakmos.github.io/oadictionary/img/og-image.jpg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1c2b45" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="icon" href="img/favicon.ico" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<main id="main-content" tabindex="-1">
  <div class="card practice-card">
    <h1 class="sr-only">תרגול אסוציאציות</h1>
    <div class="practice-hint" id="wordLabel">מהי המשמעות של המילה?</div>
    <div class="practice-word eng" id="wordEl" lang="en" role="region" aria-live="polite" aria-labelledby="wordLabel">...</div>
    <div id="scoreLine" style="color:var(--navy-soft);margin-top:6px;" aria-live="polite"></div>

    <div class="cta-row" style="margin-top:20px;">
      <button type="button" class="btn btn-primary" id="revealBtn" aria-expanded="false" aria-controls="revealBox">גלה תשובה</button>
      <button type="button" class="btn btn-secondary" id="nextBtn">מילה הבאה &larr;</button>
    </div>

    <div class="reveal-box" id="revealBox" role="region" aria-live="polite" aria-label="התשובה והאסוציאציה">
      <div class="mean" id="meanEl"></div>
      <div class="asco" id="ascoEl"></div>
      <div class="by-line" id="byEl"></div>

      <div class="stars" id="stars" role="group" aria-label="דרגו את האסוציאציה מ-1 עד 5 כוכבים">
        <button type="button" class="star" data-v="1" aria-label="דרג כוכב אחד מתוך 5">&#9734;</button>
        <button type="button" class="star" data-v="2" aria-label="דרג 2 כוכבים מתוך 5">&#9734;</button>
        <button type="button" class="star" data-v="3" aria-label="דרג 3 כוכבים מתוך 5">&#9734;</button>
        <button type="button" class="star" data-v="4" aria-label="דרג 4 כוכבים מתוך 5">&#9734;</button>
        <button type="button" class="star" data-v="5" aria-label="דרג 5 כוכבים מתוך 5">&#9734;</button>
      </div>
      <div class="sr-only" role="status" id="ratingStatus"></div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  renderChrome("practice");

  let currentDoc = null;
  let seenCount = 0;
  let ratedThisRound = false;

  const wordEl = document.getElementById("wordEl");
  const meanEl = document.getElementById("meanEl");
  const ascoEl = document.getElementById("ascoEl");
  const byEl = document.getElementById("byEl");
  const revealBox = document.getElementById("revealBox");
  const revealBtn = document.getElementById("revealBtn");
  const scoreLine = document.getElementById("scoreLine");

  // Firestore לא תומך ב"תעד אקראי" ישירות, אז בזמן הייבוא הוספנו לכל
  // מסמך שדה rand (מספר אקראי בין 0 ל-1). כדי להביא מילה אקראית: מגרילים
  // ערך, ומביאים את המסמך הראשון שה-rand שלו גדול/שווה לו (ואם אין - עוטפים לתחילת הטווח).
  async function fetchRandomWord() {
    const r = Math.random();
    let snap = await db.collection("words")
      .where("confirm", "==", 1)
      .where("rand", ">=", r)
      .orderBy("rand")
      .limit(1)
      .get();
    if (snap.empty) {
      snap = await db.collection("words")
        .where("confirm", "==", 1)
        .orderBy("rand")
        .limit(1)
        .get();
    }
    if (snap.empty) return null;
    return snap.docs[0];
  }

  const ratingStatus = document.getElementById("ratingStatus");

  function setStars(val) {
    document.querySelectorAll("#stars .star").forEach((s) => {
      const filled = Number(s.dataset.v) <= val;
      s.classList.toggle("filled", filled);
      s.textContent = filled ? "★" : "☆";
    });
  }

  async function loadNext() {
    revealBox.classList.remove("show");
    revealBtn.setAttribute("aria-expanded", "false");
    ratedThisRound = false;
    setStars(0);
    document.querySelectorAll("#stars .star").forEach((s) => { s.disabled = false; });
    ratingStatus.textContent = "";
    wordEl.textContent = "טוען...";
    try {
      const doc = await fetchRandomWord();
      if (!doc) { wordEl.textContent = "אין עדיין מילים במאגר"; return; }
      currentDoc = doc;
      const d = doc.data();
      wordEl.textContent = d.name;
      meanEl.textContent = d.mean;
      ascoEl.textContent = d.asco;
      byEl.textContent = d.username ? `אסוציאציה מאת: ${d.username}` : "";
      seenCount++;
      scoreLine.textContent = `מילה מספר ${seenCount} בסבב הזה`;
      trackEvent("practice_word", { index_in_session: seenCount });
    } catch (e) {
      console.error(e);
      wordEl.textContent = "שגיאה בטעינה - ודאו שהגדרתם את Firebase (README)";
    }
  }

  revealBtn.addEventListener("click", () => {
    revealBox.classList.add("show");
    revealBtn.setAttribute("aria-expanded", "true");
  });
  document.getElementById("nextBtn").addEventListener("click", loadNext);

  function starWord(n) {
    return n === 1 ? "כוכב אחד" : `${n} כוכבים`;
  }

  document.getElementById("stars").addEventListener("click", async (e) => {
    const star = e.target.closest(".star");
    if (!star || !currentDoc || ratedThisRound) return;
    const val = Number(star.dataset.v);
    setStars(val);
    ratedThisRound = true;
    document.querySelectorAll("#stars .star").forEach((s) => { s.disabled = true; });
    ratingStatus.textContent = `דירגתם ${starWord(val)}, תודה!`;
    trackEvent("rate_word", { stars: val });
    try {
      await db.runTransaction(async (tx) => {
        const ref = db.collection("words").doc(currentDoc.id);
        const fresh = await tx.get(ref);
        const data = fresh.data();
        const newLikes = (data.likes || 0) + 1;
        const newTotal = (data.total_rate || 0) + val;
        tx.update(ref, { likes: newLikes, total_rate: newTotal, rating: newTotal / newLikes });
      });
    } catch (err) {
      console.error("rating failed", err);
    }
  });

  loadNext();
</script>
</body>
</html>

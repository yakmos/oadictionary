<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>מילון - OADictionary</title>
<link rel="icon" href="img/favicon.ico" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<main id="main-content" tabindex="-1">
  <h1 style="margin-top:0">עיון במילון</h1>
  <div class="search-bar">
    <label for="searchInput" class="sr-only">חיפוש מילה באנגלית או בעברית</label>
    <input id="searchInput" type="text" placeholder="חיפוש מילה באנגלית או בעברית..." />
  </div>
  <div id="listWrap" aria-live="polite"><p class="loading">טוען מילים...</p></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  renderChrome("browse");

  const listWrap = document.getElementById("listWrap");
  const searchInput = document.getElementById("searchInput");
  let allWords = [];
  const PAGE_SIZE = 50;
  let shown = PAGE_SIZE;

  async function loadAllWords() {
    // המאגר קטן יחסית (כמה אלפי מילים) - נוח וזול יותר להביא הכל בשאילתה אחת
    // ולסנן בצד הלקוח, במקום לבנות אינדקס חיפוש טקסט חופשי ב-Firestore.
    // מציגים רק מילים מאושרות (confirm==1) - מילים חדשות שנשלחות דרך "הוספת מילה"
    // ממתינות לאישור ידני ב-Firestore console, בדיוק כמו באתר המקורי.
    const snap = await db.collection("words").where("confirm", "==", 1).get();
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  }

  function render(list) {
    if (!list.length) {
      listWrap.innerHTML = '<p class="loading">לא נמצאו מילים תואמות</p>';
      return;
    }
    const visible = list.slice(0, shown);
    listWrap.innerHTML = `
      <div class="word-list">
        ${visible.map((w) => `
          <button type="button" class="word-item" data-id="${w.id}" aria-expanded="false" aria-controls="detail-${w.id}">
            <div class="w-row">
              <div>
                <span class="w-name eng" lang="en">${escapeHtml(w.name)}</span>
                &nbsp;-&nbsp;
                <span class="w-mean">${escapeHtml(w.mean)}</span>
              </div>
              <div class="pill">${w.likes ? "&#9733; " + Number(w.rating || 0).toFixed(1) : "עדיין ללא דירוג"}</div>
            </div>
            <div class="word-detail" id="detail-${w.id}">
              ${escapeHtml(w.asco)}
              ${w.username ? `<div class="pill" style="margin-top:8px;">נוסף ע"י ${escapeHtml(w.username)}</div>` : ""}
            </div>
          </button>
        `).join("")}
      </div>
      ${list.length > shown ? `<div class="cta-row" style="margin-top:16px;"><button type="button" class="btn btn-secondary" id="loadMoreBtn">טען עוד</button></div>` : ""}
    `;
    listWrap.querySelectorAll(".word-item").forEach((el) => {
      el.addEventListener("click", () => {
        const isOpen = el.classList.toggle("open");
        el.setAttribute("aria-expanded", String(isOpen));
      });
    });
    const moreBtn = document.getElementById("loadMoreBtn");
    if (moreBtn) moreBtn.addEventListener("click", () => { shown += PAGE_SIZE; render(currentFiltered()); });
  }

  let lastQuery = "";
  function currentFiltered() {
    const q = lastQuery.trim().toLowerCase();
    if (!q) return allWords;
    return allWords.filter((w) =>
      (w.name || "").toLowerCase().includes(q) || (w.mean || "").includes(q)
    );
  }

  searchInput.addEventListener("input", (e) => {
    lastQuery = e.target.value;
    shown = PAGE_SIZE;
    render(currentFiltered());
  });

  loadAllWords()
    .then((words) => {
      allWords = words;
      render(currentFiltered());
    })
    .catch((e) => {
      console.error(e);
      listWrap.innerHTML = '<p class="loading" role="alert">שגיאה בטעינת המילון - ודאו שהגדרתם את Firebase (README)</p>';
    });
</script>
</body>
</html>

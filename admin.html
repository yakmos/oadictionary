<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>ניהול - OADictionary</title>
<link rel="icon" href="img/favicon.ico" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<main id="main-content" tabindex="-1">
  <h1 style="margin-top:0">פאנל ניהול</h1>

  <form id="loginBox" class="card admin-login">
    <button type="button" class="btn-google" id="adminGoogleBtn" style="align-self:stretch;justify-content:center">
      <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      <span>התחברות עם גוגל</span>
    </button>
    <p style="text-align:center;color:var(--navy-soft);font-size:.85rem;margin:10px 0">— או —</p>
    <label for="loginEmail" style="color:var(--navy-soft);font-size:.9rem">אימייל</label>
    <input id="loginEmail" type="email" autocomplete="username" required aria-required="true" placeholder="you@example.com" />
    <label for="loginPass" style="color:var(--navy-soft);font-size:.9rem">סיסמה</label>
    <input id="loginPass" type="password" autocomplete="current-password" required aria-required="true" placeholder="••••••••" />
    <button type="submit" class="btn btn-primary" id="loginBtn">התחברות</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>

  <div id="panel" style="display:none">
    <div class="admin-bar">
      <div id="pendingCount" style="color:var(--navy-soft)" aria-live="polite"></div>
      <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">התנתקות</button>
    </div>
    <div id="pendingList" aria-live="polite"></div>
    <p id="emptyMsg" style="display:none;color:var(--navy-soft);text-align:center;padding:30px">
      אין מילים ממתינות לאישור כרגע 🎉
    </p>

    <h2 style="margin-top:40px">קובץ ה-PDF - מחיר ולידים</h2>

    <div class="card" style="max-width:360px;margin-bottom:24px">
      <label for="priceInput" style="color:var(--navy-soft);font-size:.9rem">מחיר הקובץ (₪)</label>
      <input id="priceInput" type="number" step="0.10" min="0" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--card-border);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem;margin:6px 0 12px" />
      <button type="button" class="btn btn-primary btn-sm" id="savePriceBtn">שמירת מחיר</button>
      <div class="msg" id="priceMsg" role="alert"></div>
      <p style="color:var(--navy-soft);font-size:.8rem;margin-top:10px">
        המחיר הזה מוצג אוטומטית בדף <a href="premium.html">premium.html</a> - שינוי כאן משנה אותו מיד לכל המבקרים.
      </p>
    </div>

    <div id="leadsCount" style="color:var(--navy-soft);margin-bottom:10px" aria-live="polite"></div>
    <div id="leadsList" aria-live="polite"></div>
    <p id="leadsEmptyMsg" style="display:none;color:var(--navy-soft);text-align:center;padding:30px">
      עדיין אין פניות מעוניינים בקובץ ה-PDF.
    </p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  renderChrome("admin");

  const loginBox = document.getElementById("loginBox");
  const panel = document.getElementById("panel");
  const loginMsg = document.getElementById("loginMsg");
  const pendingList = document.getElementById("pendingList");
  const pendingCount = document.getElementById("pendingCount");
  const emptyMsg = document.getElementById("emptyMsg");
  const priceInput = document.getElementById("priceInput");
  const savePriceBtn = document.getElementById("savePriceBtn");
  const priceMsg = document.getElementById("priceMsg");
  const leadsCount = document.getElementById("leadsCount");
  const leadsList = document.getElementById("leadsList");
  const leadsEmptyMsg = document.getElementById("leadsEmptyMsg");

  loginBox.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPass").value;
    if (!email || !pass) return;
    loginMsg.className = "msg";
    try {
      await firebase.auth().signInWithEmailAndPassword(email, pass);
    } catch (err) {
      loginMsg.textContent = "התחברות נכשלה - בדקו אימייל/סיסמה.";
      loginMsg.className = "msg show err";
    }
  });

  document.getElementById("adminGoogleBtn").addEventListener("click", async () => {
    loginMsg.className = "msg";
    try {
      await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    } catch (err) {
      console.error(err);
      if (err && err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
        loginMsg.textContent = "התחברות עם גוגל נכשלה - נסו שוב.";
        loginMsg.className = "msg show err";
      }
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => firebase.auth().signOut());

  firebase.auth().onAuthStateChanged((user) => {
    if (user) {
      loginBox.style.display = "none";
      panel.style.display = "block";
      loadPending();
      loadPriceSetting();
      loadLeads();
    } else {
      loginBox.style.display = "flex";
      panel.style.display = "none";
    }
  });

  async function loadPending() {
    pendingList.innerHTML = '<p class="loading">טוען...</p>';
    try {
      const snap = await db.collection("words").where("confirm", "==", 0).get();
      pendingList.innerHTML = "";
      pendingCount.textContent = `${snap.size} מילים ממתינות לאישור`;
      emptyMsg.style.display = snap.empty ? "block" : "none";
      snap.forEach((doc) => {
        const d = doc.data();
        const item = document.createElement("div");
        item.className = "pending-item";
        item.innerHTML = `
          <div class="w-name eng" lang="en">${escapeHtml(d.name)}</div>
          <div class="w-mean">${escapeHtml(d.mean)}</div>
          <div class="w-asco">${escapeHtml(d.asco)}</div>
          <div class="w-user">נשלח ע"י: ${escapeHtml(d.username || "אנונימי")}</div>
          <div class="admin-actions">
            <button type="button" class="btn btn-approve btn-sm" data-action="approve" aria-label="אשר את המילה ${escapeHtml(d.name)}">אשר</button>
            <button type="button" class="btn btn-delete btn-sm" data-action="delete" aria-label="מחק את המילה ${escapeHtml(d.name)}">מחק</button>
          </div>
        `;
        item.querySelector('[data-action="approve"]').addEventListener("click", async (e) => {
          e.target.disabled = true;
          try {
            await db.collection("words").doc(doc.id).update({ confirm: 1 });
            item.remove();
            refreshCount();
          } catch (err) {
            console.error(err);
            e.target.disabled = false;
            alert("שגיאה באישור המילה");
          }
        });
        item.querySelector('[data-action="delete"]').addEventListener("click", async (e) => {
          if (!confirm(`למחוק את "${d.name}"?`)) return;
          e.target.disabled = true;
          try {
            await db.collection("words").doc(doc.id).delete();
            item.remove();
            refreshCount();
          } catch (err) {
            console.error(err);
            e.target.disabled = false;
            alert("שגיאה במחיקת המילה");
          }
        });
        pendingList.appendChild(item);
      });
    } catch (err) {
      console.error(err);
      pendingList.innerHTML = '<p class="loading" role="alert">שגיאה בטעינת המילים הממתינות.</p>';
    }
  }

  function refreshCount() {
    const left = pendingList.querySelectorAll(".pending-item").length;
    pendingCount.textContent = `${left} מילים ממתינות לאישור`;
    emptyMsg.style.display = left === 0 ? "block" : "none";
  }

  async function loadPriceSetting() {
    try {
      const doc = await db.collection("settings").doc("premium_pdf").get();
      const price = doc.exists && typeof doc.data().price === "number" ? doc.data().price : 89.9;
      priceInput.value = price;
    } catch (err) {
      console.error(err);
      priceMsg.textContent = "שגיאה בטעינת המחיר הנוכחי.";
      priceMsg.className = "msg show err";
    }
  }

  savePriceBtn.addEventListener("click", async () => {
    const val = parseFloat(priceInput.value);
    if (isNaN(val) || val < 0) {
      priceMsg.textContent = "יש להזין מחיר תקין.";
      priceMsg.className = "msg show err";
      return;
    }
    savePriceBtn.disabled = true;
    priceMsg.className = "msg";
    try {
      await db.collection("settings").doc("premium_pdf").set({ price: val }, { merge: true });
      priceMsg.textContent = "המחיר נשמר בהצלחה ✔";
      priceMsg.className = "msg show ok";
    } catch (err) {
      console.error(err);
      priceMsg.textContent = "שגיאה בשמירת המחיר.";
      priceMsg.className = "msg show err";
    } finally {
      savePriceBtn.disabled = false;
    }
  });

  async function loadLeads() {
    leadsList.innerHTML = '<p class="loading">טוען...</p>';
    try {
      const snap = await db.collection("leads").orderBy("createdAt", "desc").get();
      leadsList.innerHTML = "";
      leadsCount.textContent = `${snap.size} פניות מעוניינים`;
      leadsEmptyMsg.style.display = snap.empty ? "block" : "none";
      snap.forEach((doc) => {
        const d = doc.data();
        const when = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleString("he-IL") : "";
        const item = document.createElement("div");
        item.className = "pending-item";
        item.innerHTML = `
          <div class="w-name">${escapeHtml(d.name || "")}</div>
          <div class="w-mean">${escapeHtml(d.contact || "")}</div>
          <div class="w-user">${escapeHtml(when)}</div>
          <div class="admin-actions">
            <button type="button" class="btn btn-delete btn-sm" data-action="delete" aria-label="מחק פנייה של ${escapeHtml(d.name || "")}">מחק</button>
          </div>
        `;
        item.querySelector('[data-action="delete"]').addEventListener("click", async (e) => {
          if (!confirm(`למחוק את הפנייה של "${d.name}"?`)) return;
          e.target.disabled = true;
          try {
            await db.collection("leads").doc(doc.id).delete();
            item.remove();
            const left = leadsList.querySelectorAll(".pending-item").length;
            leadsCount.textContent = `${left} פניות מעוניינים`;
            leadsEmptyMsg.style.display = left === 0 ? "block" : "none";
          } catch (err) {
            console.error(err);
            e.target.disabled = false;
            alert("שגיאה במחיקת הפנייה");
          }
        });
        leadsList.appendChild(item);
      });
    } catch (err) {
      console.error(err);
      leadsList.innerHTML = '<p class="loading" role="alert">שגיאה בטעינת הפניות.</p>';
    }
  }
</script>
</body>
</html>
